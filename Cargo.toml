# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-library-tls"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-library-tls"
description = "TLS for Xmip: a guarded connection, hybrid key exchange, the protocol inside agreed by ALPN, the node's certificate."

[lib]
path = "src/lib.rs"

[dependencies]
# rustls with its default provider, aws-lc-rs, because ring has no ML-KEM and
# the hybrid key exchange is the point (ADR-0033, amendment 2026-09-22). Its
# assembler comes prebuilt, so a Windows build needs no NASM.
rustls = "0.23"
# The operating system's trust store rather than a bundled root list: the
# organizations Xmip is aimed at run their own certificate authorities.
rustls-native-certs = "0.8"
# Reading a certificate chain and a private key as PEM.
rustls-pemfile = "2"

[dev-dependencies]
# A self-signed certificate for the handshake tests. Test-only.
rcgen = "0.13"

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
